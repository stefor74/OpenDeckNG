name: "publish"

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-22.04-arm"
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      DENO_DIR: deno_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ hashFiles('deno.lock') }}

      - name: install frontend dependencies
        run: deno install

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev xdg-utils libdbus-1-dev

      - name: Build Linux Starter Pack plugin
        run: |
          deno task build:plugins

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: deno task tauri
          tagName: tv__VERSION__
          releaseName: "OpenDeckNG v__VERSION__"
          releaseBody: |
            OpenDeckNG – Next-gen stream controller for Linux.

            ## Installation
            - **Arch/CachyOS**: Install via AUR (`opendeckng` or `opendeckng-bin`)
            - **Other distros**: Download the `.tar.gz` or `.deb` from assets
            - **Hyprland users**: See the wiki for integration tips

            ## What's New
            - Native GIF animation support
            - Linux Starter Pack (Media, Audio, System Monitor, Hyprland, Counter)
            - Profile backgrounds (experimental)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
